# Deploy the built site to GitHub Pages (project site: /KubernetesPrototypes/).
#
# Two one-time manual steps this file cannot do for you:
#   1. Repo settings → Pages → Build and deployment: Source = GitHub Actions.
#      Until that is switched, Pages keeps serving the repository source from the
#      branch — which is the dev index.html referencing /src/main.tsx, and that is
#      why the published page was blank.
#   2. Repo settings → Secrets and variables → Actions: add GH_PAT, a token with
#      read:packages. @jetbrains/int-ui-kit comes from GitHub Packages (see
#      .npmrc), and the runner has no credentials for it — the repo's own
#      GITHUB_TOKEN cannot read packages published under another org.
#
# The asset prefix lives in vite.config.ts as `base: '/KubernetesPrototypes/'`,
# matching https://<user>.github.io/KubernetesPrototypes/. If the published URL
# ever turns out to be a root instead (Pages sometimes serves Actions
# deployments at a *.pages.github.io root), change that one line to '/'.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # @jetbrains/int-ui-kit comes from GitHub Packages (see .npmrc) and the
      # runner has no credentials for it. The token is written into npm's own
      # config here rather than through setup-node's registry-url template: an
      # unset secret expands to an empty string silently, and npm then fails with
      # "authentication token not provided", which says nothing about the cause.
      # Checking it explicitly turns that into a readable error at the right step.
      - name: Authenticate to GitHub Packages
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "::error::Secret GH_PAT is missing or empty. Add a token with read:packages under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          npm config set //npm.pkg.github.com/:_authToken "$GH_PAT"

      - name: Install and build
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
